<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="winShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="panelShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Browser window -->
  <g filter="url(#winShadow)">
    <rect x="20" y="26" width="440" height="284" rx="16" fill="#f8fafc" stroke="#e2e8f0" />
  </g>
  <!-- Title bar -->
  <path d="M20 42 a16 16 0 0 1 16 -16 h408 a16 16 0 0 1 16 16 v20 h-440 z" fill="#ffffff" />
  <line x1="20" y1="62" x2="460" y2="62" stroke="#eef2f7" />
  <circle cx="44" cy="44" r="5" fill="#e2e8f0" />
  <circle cx="62" cy="44" r="5" fill="#e2e8f0" />
  <circle cx="80" cy="44" r="5" fill="#e2e8f0" />

  <!-- Highlighted target button -->
  <rect x="120" y="150" width="156" height="50" rx="11" fill="#0f172a" />
  <text x="198" y="181" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Get started</text>
  <rect x="113" y="143" width="170" height="64" rx="14" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <rect x="113" y="115" width="92" height="22" rx="6" fill="#38bdf8" />
  <text x="123" y="130" fill="#ffffff" font-size="12" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">button.cta</text>

  <!-- Picker panel (overlaps bottom-right) -->
  <g filter="url(#panelShadow)">
    <rect x="288" y="196" width="184" height="132" rx="13" fill="#ffffff" stroke="#e2e8f0" />
  </g>
  <!-- header -->
  <rect x="304" y="212" width="22" height="22" rx="6" fill="#0f172a" />
  <circle cx="315" cy="223" r="6" fill="none" stroke="#ffffff" stroke-width="1.8" />
  <circle cx="315" cy="223" r="1.8" fill="#ffffff" />
  <text x="334" y="227" fill="#0f172a" font-size="13" font-weight="600">OpenPicker</text>
  <line x1="304" y1="244" x2="456" y2="244" stroke="#eef2f7" />
  <!-- selector -->
  <text x="304" y="265" fill="#94a3b8" font-size="9" font-weight="700" letter-spacing="0.6">SELECTOR</text>
  <rect x="304" y="272" width="152" height="24" rx="7" fill="#0f172a" />
  <text x="313" y="288" fill="#e2e8f0" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">button.cta</text>
  <!-- match pill -->
  <rect x="304" y="304" width="70" height="18" rx="9" fill="#ecfdf5" />
  <text x="313" y="317" fill="#047857" font-size="10.5" font-weight="600">✓ 1 match</text>
</svg>
