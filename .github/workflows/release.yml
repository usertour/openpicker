name: Release

# Publishes the public workspace packages (@openpicker/protocol, @openpicker/sdk)
# to npm when a v* tag is pushed (e.g. v0.2.0). The tag tracks @openpicker/sdk's
# version; @openpicker/protocol is published only when its own version is not yet
# on npm. Requires an npm automation token in the repo secret NPM_TOKEN
# (Settings → Secrets and variables → Actions → New repository secret).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # On a v-tag, the tag must match the package version so npm and git agree.
      - name: Verify tag matches @openpicker/sdk version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/sdk/package.json').version")"
          echo "tag=$TAG pkg=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match @openpicker/sdk version $PKG"
            exit 1
          fi

      - name: Typecheck
        run: pnpm -r typecheck

      # Publishes every non-private workspace package in dependency order
      # (@openpicker/protocol, then @openpicker/sdk). pnpm skips any package whose
      # version is already on npm, so re-tagging or a prior manual publish is safe.
      # Each package's prepublishOnly rebuilds its dist; access is public via each
      # package's publishConfig.
      - name: Publish to npm
        run: pnpm -r publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
