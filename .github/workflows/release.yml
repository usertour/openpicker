name: Release

# Publishes @openpicker/sdk to npm when a v* tag is pushed (e.g. v0.2.0).
# Requires an npm automation token in the repo secret NPM_TOKEN
# (Settings → Secrets and variables → Actions → New repository secret).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # On a v-tag, the tag must match the package version so npm and git agree.
      - name: Verify tag matches @openpicker/sdk version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/sdk/package.json').version")"
          echo "tag=$TAG pkg=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match @openpicker/sdk version $PKG"
            exit 1
          fi

      - name: Typecheck
        run: pnpm -r typecheck

      # Idempotent: skip publishing a version that's already on npm (so re-tagging
      # or a manual prior publish doesn't fail the run).
      - name: Check if already published
        id: check
        run: |
          VERSION="$(node -p "require('./packages/sdk/package.json').version")"
          if npm view "@openpicker/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@openpicker/sdk@$VERSION already on npm — skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        run: pnpm --filter @openpicker/sdk publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
